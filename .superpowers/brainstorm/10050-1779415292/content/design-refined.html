<h2>Refined Design — Option A</h2>
<p class="subtitle">Recurring = always-on style. Trial + Expiry = toggle cards. Click a state to approve or comment below.</p>

<style>
  .mockup-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; color: #1e1e1e; }
  .plan-item { background: #fff; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; }

  /* Header row */
  .plan-header { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: #f6f7f7; border-bottom: 1px solid #e5e5e5; }
  .plan-header input[type=text] { border: 1px solid #ccc; border-radius: 4px; padding: 5px 8px; font-size: 13px; background: #fff; color: #333; }
  .label-input { flex: 1; }
  .price-input { width: 70px; text-align: right; }
  .drag-handle { color: #bbb; font-size: 15px; }
  .plan-actions { display: flex; gap: 4px; margin-left: auto; }
  .plan-actions button { border: 1px solid #ccc; background: #fff; border-radius: 50%; width: 24px; height: 24px; font-size: 15px; line-height: 1; cursor: pointer; color: #555; display:flex;align-items:center;justify-content:center; }

  /* Plan body */
  .plan-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }

  /* Recurring card — distinct: solid left accent, tinted bg, no toggle */
  .card-recurring {
    background: #f0faf2;
    border: 1px solid #b6e0bf;
    border-left: 4px solid #2fb344;
    border-radius: 5px;
    padding: 10px 12px;
  }
  .card-recurring .section-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .6px; color: #1e8a35; margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .card-recurring .section-label::after {
    content: "Always active";
    font-size: 10px; font-weight: 600; background: #2fb344; color: #fff;
    border-radius: 3px; padding: 1px 5px; letter-spacing: 0; text-transform: none;
  }

  /* Toggle cards — Trial / Expiry */
  .card-toggle {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 5px;
    overflow: hidden;
  }
  .card-toggle .toggle-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 12px;
    background: #fafafa;
    border-bottom: 1px solid #eee;
  }
  .card-toggle.is-off .toggle-header { border-bottom: none; }
  .toggle-header .section-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .6px; color: #555;
  }
  .card-toggle .card-body-inner {
    padding: 10px 12px;
  }

  /* Input row */
  .input-row { display: flex; gap: 8px; align-items: center; }
  .input-row input[type=number] { width: 72px; border: 1px solid #ccc; border-radius: 4px; padding: 5px 8px; font-size: 13px; color:#333; }
  .input-row select { border: 1px solid #ccc; border-radius: 4px; padding: 5px 8px; font-size: 13px; background: #fff; color:#333; flex:1; max-width:120px; }

  /* Date input */
  .date-input { border: 1px solid #ccc; border-radius: 4px; padding: 5px 10px; font-size: 13px; color: #555; background: #fff; width: 140px; }

  /* Toggle */
  .toggle { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink:0; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .slider-t { position: absolute; inset: 0; background: #ccc; border-radius: 20px; }
  .slider-t.on { background: #2fb344; }
  .slider-t::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: white; }
  .slider-t.on::after { transform: translateX(16px); }

  .split { gap: 32px; }
  .mockup { flex: 1; }
  .mock-label { font-size: 12px; font-weight: 600; color: #666; margin-bottom: 10px; text-align: center; letter-spacing: .3px; }
</style>

<div class="split">
  <!-- STATE: Toggle OFF -->
  <div class="mockup" data-choice="toggle-off" onclick="toggleSelect(this)">
    <div class="mockup-header">Toggle OFF — collapsed</div>
    <div class="mockup-body" style="padding:14px; background:#f5f5f5;">
      <div class="plan-item">
        <div class="plan-header">
          <span class="drag-handle">⠿</span>
          <input type="text" class="label-input" value="First Choice" readonly>
          <input type="text" class="price-input" value="7.00" readonly>
          <div class="plan-actions"><button>+</button><button>×</button></div>
        </div>
        <div class="plan-body">
          <!-- Recurring — always on, distinct -->
          <div class="card-recurring">
            <div class="section-label">Recurring Details</div>
            <div class="input-row">
              <input type="number" value="1" readonly>
              <select><option>Week(s)</option></select>
            </div>
          </div>
          <!-- Trial — OFF -->
          <div class="card-toggle is-off">
            <div class="toggle-header">
              <span class="section-label">Trial Period</span>
              <label class="toggle"><span class="slider-t"></span></label>
            </div>
          </div>
          <!-- Expiry — OFF -->
          <div class="card-toggle is-off">
            <div class="toggle-header">
              <span class="section-label">Expiry Date</span>
              <label class="toggle"><span class="slider-t"></span></label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- STATE: Toggle ON -->
  <div class="mockup" data-choice="toggle-on" onclick="toggleSelect(this)">
    <div class="mockup-header">Toggle ON — expanded</div>
    <div class="mockup-body" style="padding:14px; background:#f5f5f5;">
      <div class="plan-item">
        <div class="plan-header">
          <span class="drag-handle">⠿</span>
          <input type="text" class="label-input" value="First Choice" readonly>
          <input type="text" class="price-input" value="7.00" readonly>
          <div class="plan-actions"><button>+</button><button>×</button></div>
        </div>
        <div class="plan-body">
          <!-- Recurring — always on, distinct -->
          <div class="card-recurring">
            <div class="section-label">Recurring Details</div>
            <div class="input-row">
              <input type="number" value="1" readonly>
              <select><option>Week(s)</option></select>
            </div>
          </div>
          <!-- Trial — ON -->
          <div class="card-toggle">
            <div class="toggle-header">
              <span class="section-label">Trial Period</span>
              <label class="toggle"><span class="slider-t on"></span></label>
            </div>
            <div class="card-body-inner">
              <div class="input-row">
                <input type="number" value="2" readonly>
                <select><option>Week(s)</option></select>
              </div>
            </div>
          </div>
          <!-- Expiry — ON -->
          <div class="card-toggle">
            <div class="toggle-header">
              <span class="section-label">Expiry Date</span>
              <label class="toggle"><span class="slider-t on"></span></label>
            </div>
            <div class="card-body-inner">
              <input class="date-input" value="2026-05-20" readonly>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
