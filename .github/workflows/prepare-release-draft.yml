name: Prepare Release Draft

on:
  push:
    branches: [develop]

jobs:
  draft:
    if: "contains(toJson(github.event.commits), 'release: create tag')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect the pending changelog entry
        id: collect
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const today = new Date().toISOString().slice(0, 10).split('-').reverse().join('-');
            const content = fs.readFileSync('readme.txt', 'utf8');
            const match = content.match(/=\s*([\d.]+)\s*-\s*xx-xx-\d{4}\s*=\n([\s\S]*?)(?=\n=\s*[\d.]+\s*-|\n*$)/);

            if (!match) {
              core.setFailed('No pending changelog entry found (looking for "xx-xx-" in readme.txt).');
              return;
            }

            const version = match[1];
            const bullets = match[2].trim();
            if (!/^\*\s*\S/m.test(bullets)) {
              core.setFailed('Pending changelog entry has no filled-in bullet text yet.');
              return;
            }

            fs.writeFileSync('draft-release-body.md', `= ${version} - ${today} =\n${bullets}`);
            core.setOutput('version', version);

      - name: Create or update the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.collect.outputs.version }}
        run: |
          if gh release view "$VERSION" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q true; then
            echo "Updating existing draft: $VERSION"
            gh release edit "$VERSION" --notes-file draft-release-body.md
          else
            echo "Creating new draft: $VERSION"
            gh release create "$VERSION" --target "${{ github.sha }}" --draft --title "Everest Forms $VERSION" --notes-file draft-release-body.md
          fi
