name: Evf Staging QA Test

on:
    push:
        branches:
            - staging
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code From Current Branch
        uses: actions/checkout@v2

      - name: Add Private SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TG_PRIVATE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add GitHub Email & Username
        env:
          MY_EMAIL: ${{ secrets.TG_GITHUB_EMAIL }}
          MY_USERNAME: ${{ secrets.TG_GITHUB_USERNAME }}
        run: |
          git config --global user.email "$MY_EMAIL"
          git config --global user.name "$MY_USERNAME"

      - name: Use Node.js 12.x
        uses: actions/setup-node@v2
        with:
          node-version: 12.x

      - name: Setup PHP v7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: cli, dev, curl, mbstring, xmlrpc

      - name: NPM, Composer Install & NPM Build
        run: |
          npm cache clean --force
          rm -rf everest-forms.zip
          rm -rf node_modules
          rm -rf package-lock.json
          npm install --legacy-peer-deps --force
          composer install
          npm run build --legacy-peer-deps --force
          composer install --no-dev
          mkdir -p everest-forms || true
          rsync -rc --exclude-from="./.distignore" "./" "./everest-forms" --delete --delete-excluded

      - name: Copy plugin file to server
        env:
          Srv_IP: ${{ secrets.QA_AUTOMATION_SERVER_IP }}
          Srv_UsrName: ${{ secrets.QA_AUTOMATION_SERVER_USERNAME }}
          Server_PASS: ${{ secrets.QA_AUTOMATION_SERVER_PASS }}
        run: |
          sshpass -p "$Server_PASS" rsync -ahPz -e "ssh -o StrictHostKeyChecking=no" everest-forms $Srv_UsrName@$Srv_IP:/var/www/evfautomation.wp1.site/wp-content/plugins

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
      - run: chrome --version

      - name: Set up Python 3.12.1
        uses: actions/setup-python@v3
        with:
          python-version: 3.12.1
      - run: python -v

      - name: Automation Test Script everest forms
        run: |
          mkdir python-code
          cd python-code
          git init
          git remote add origin git@github.com:wpeverest/EVF-Automation.git
          git pull origin test-evf-free
          pip install -r requirements.txt
          chmod +x test_evf_free.sh
          bash ./test_evf_free.sh
        continue-on-error: true

      - name: Test Report Generation
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: Report
          path: python-code/results

      - name: Upload Test Report to Server
        if: success() || failure()
        env:
          Srv_IP: ${{ secrets.QA_AUTOMATION_SERVER_IP }}
          Srv_UsrName: ${{ secrets.QA_AUTOMATION_SERVER_USERNAME }}
          Server_PASS: ${{ secrets.QA_AUTOMATION_SERVER_PASS }}
        run: |
          REPORT_DIR=/var/www/evfautomation.wp1.site/reports

          sshpass -p "$Server_PASS" ssh -o StrictHostKeyChecking=no $Srv_UsrName@$Srv_IP "mkdir -p $REPORT_DIR && rm -rf $REPORT_DIR/*"
          sshpass -p "$Server_PASS" scp -o StrictHostKeyChecking=no -r python-code/results/* $Srv_UsrName@$Srv_IP:$REPORT_DIR/
          sshpass -p "$Server_PASS" ssh -o StrictHostKeyChecking=no $Srv_UsrName@$Srv_IP "chmod 755 -R $REPORT_DIR"

          echo "https://evfautomation.wp1.site/reports/report.html"
